# Despliegue en Render desde GitHub (Blueprint). Render lee este archivo, crea el servicio y lo vuelve a publicar en cada push a main.
# La base de datos y los archivos NO viven en Render: están en Supabase (DATABASE_URL y Supabase Storage).
services:
  - type: web
    name: ciudadela-digital
    runtime: python
    plan: free                 # gratis: se «duerme» tras 15 min sin uso y tarda ~1 min en despertar. Para operar de verdad, plan de pago.
    region: virginia           # la más cercana a Colombia; en Supabase elige East US (N. Virginia) para que queden juntas
    buildCommand: pip install -r requirements.txt
    # Cada arranque: aplica migraciones pendientes, asegura roles/administrador y levanta la API.
    startCommand: alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /salud
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true     # Render la genera una vez y la conserva
      - key: DATABASE_URL
        sync: false             # la pegas en el panel de Render (Supabase → Connect → Session pooler)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALMACEN
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: ciudadela-archivos
      - key: VAPID_PUBLIC_KEY      # avisos push: genera el par con  python -m app.generar_vapid
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT          # p. ej. mailto:tu_correo@ejemplo.com
        sync: false
      - key: PAGOS_SIMULADOS
        value: "0"              # en producción NO hay pagos de mentira
      - key: REAUTH_ACTIVA            # v5.3 · pide la contraseña de nuevo en acciones sensibles del administrador (crear/desactivar usuarios, exportar datos…)
        value: "1"
      - key: SESION_INACTIVIDAD_ADMIN_MIN   # v5.3 · el administrador se cierra tras estos minutos SIN actividad (480 = 8 horas)
        value: "480"
      - key: EXIGIR_2FA_ADMIN         # v5.3 · «1» = la verificación en dos pasos del administrador es obligatoria (actívala primero en Ajustes)
        value: "0"
      - key: PAGOS_INSTRUCCIONES
        sync: false
      - key: CONJUNTO_NOMBRE          # v3.5 · página pública del pase de visitante (todo opcional)
        sync: false
      - key: CONJUNTO_DIRECCION       # p. ej. Calle 10 # 5-20, Facatativá
        sync: false
      - key: CONJUNTO_LATITUD         # con latitud y longitud, «Cómo llegar» apunta al punto exacto de la portería
        sync: false
      - key: CONJUNTO_LONGITUD
        sync: false
      - key: PAZ_Y_SALVO_DIAS         # v3.6 · días de validez del paz y salvo (por defecto 30)
        sync: false
      - key: URL_PUBLICA              # v3.6 · opcional: dirección pública de la app para el QR del paz y salvo
        sync: false
      - key: DOCS_ACTIVAS             # v4.2 · «1» = /docs (Swagger) visible para la demo; «0» = oculto (ponlo en «0» en la app de un cliente ya contratado)
        value: "1"
      - key: LANDING_ACTIVA           # v4.7 · «0» en la APP REAL: la raíz (/) abre directo la app y «Solicitar demo» queda desactivado. La landing vive SOLO en el servicio de la demo (ver abajo).
        value: "0"
      - key: MARCA_NOMBRE             # v4.0 · white-label (todo opcional: sin ellas la app es «Ciudadela Digital»)
        sync: false
      - key: MARCA_NOMBRE_CORTO
        sync: false
      - key: MARCA_ESLOGAN
        sync: false
      - key: MARCA_COLOR              # #RRGGBB
        sync: false
      - key: MARCA_ASISTENTE
        sync: false

