name: Pruebas
# Corre las pruebas automáticas en cada push y Pull Request. Si fallan, GitHub lo marca con una ❌ antes de unir los cambios.
on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/js/atras.test.mjs      # v4.2 · botón «Atrás» del celular
      - run: node --test tests/js/imports.test.mjs    # v5.5 · que ningún import del frontend apunte a algo que no existe
      - run: python -m pytest -q
        env:
          SECRET_KEY: clave-solo-para-ci-0123456789abcdef0123456789
