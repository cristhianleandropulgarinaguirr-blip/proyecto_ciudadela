<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Ciudadela Digital · Administración de propiedad horizontal</title>
  <meta name="description" content="Reservas, mantenimiento, cartera y portería de tu conjunto residencial en un solo lugar.">
  <meta name="theme-color" content="#07304A">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="apple-touch-icon" href="img/apple-touch-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ciudadela">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Fuentes sin bloquear el primer pintado: se piden como «preload» y js/fuentes.js las activa al llegar (el texto se ve ya con la fuente de respaldo).
       Sin JavaScript inline: la política de seguridad (CSP) solo permite scripts propios. -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Instrument+Sans:wght@400..700&family=DM+Mono:wght@400;500&display=swap" id="fuentes-precarga">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Instrument+Sans:wght@400..700&family=DM+Mono:wght@400;500&display=swap"></noscript>

  <link rel="stylesheet" href="estilos.css">
  <!-- Empieza a bajar lo que se necesita para arrancar, sin esperar a que el navegador descubra los imports -->
  <link rel="modulepreload" href="js/app.js">
  <link rel="modulepreload" href="js/ui.js">
  <link rel="modulepreload" href="js/api.js">
  <link rel="modulepreload" href="js/red.js">
  <link rel="modulepreload" href="js/offline.js">
  <link rel="modulepreload" href="js/almacen.js">
  <link rel="modulepreload" href="js/vistas/login.js">
  <!-- Se ejecuta antes de pintar para evitar el "parpadeo" blanco en modo oscuro -->
  <script src="js/tema.js"></script>
  <script src="js/fuentes.js" defer></script>
</head>
<body>
  <div class="ciudad" aria-hidden="true"></div>
  <div id="app" aria-live="polite"></div>
  <div id="toasts" role="status" aria-live="polite"></div>
  <dialog id="modal" class="modal"></dialog>

  <noscript><p style="padding:2rem;font-family:sans-serif">Ciudadela Digital necesita JavaScript para funcionar.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
